name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # swiftly (swift.org's toolchain installer) for the jobs that install Swift
  # on macOS. The versioned .pkg is pinned and checked, so a new swiftly
  # release cannot change CI unnoticed.
  SWIFTLY_VERSION: "1.2.0"
  SWIFTLY_SHA256: a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    env:
      # swift-format comes with the toolchain, so it is pinned with it.
      SWIFT_VERSION: "6.4"
      # SwiftLint's portable release binary, pinned and checked.
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          swift format --version
          swiftlint --version

      - name: swift-format (lint mode, strict)
        run: |
          swift format lint --recursive --strict --configuration .swift-format \
            Sources Tests Scripts Benchmarks/Package.swift Benchmarks/Sources Benchmarks/Benchmarks

      - name: SwiftLint (strict)
        run: swiftlint --strict

      # The DocC articles are made from Readme.md. This fails when one was
      # edited by hand, or when Readme.md changed and the script wasn't run.
      - name: DocC articles match Readme.md
        run: swift Scripts/make-docc-articles.swift --check

  macos:
    name: Test macOS
    runs-on: macos-26
    env:
      SWIFT_VERSION: "6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's default Xcode ships an older Swift; install the exact
      # toolchain with swiftly so macOS and Linux build with the same compiler.
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

  simulators:
    name: Test ${{ matrix.platform }} Simulator
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            device-filter: iPhone
          - platform: tvOS
            device-filter: Apple TV
          - platform: watchOS
            device-filter: Apple Watch
          - platform: visionOS
            device-filter: Apple Vision
    env:
      # swift-tools-version 6.3 needs Xcode 26.4 or later; Xcode 26.6 ships
      # Swift 6.3.3. Selected explicitly so a change of the image's default
      # Xcode cannot change the compiler or SDKs.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Test (${{ matrix.platform }} Simulator)
        run: |
          set -o pipefail
          LINE=$(xcrun simctl list devices available | grep -m1 "${{ matrix.device-filter }}")
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Using simulator: $LINE"
          xcodebuild test -scheme fp-swift-pipe -destination "id=$UDID,arch=arm64" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | tail -60

      # The tail above can cut off the first issues of a failing run, which
      # name the cause (a time limit, say); list every one of them.
      - name: Show test issues
        if: failure()
        run: grep -E "✘|recorded an issue" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400 || true

  linux:
    name: Test Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.3 is the package's swift-tools-version, the oldest compiler it
        # claims to support; 6.4 is the compiler the other jobs use.
        swift: ["6.3", "6.4"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test
