name: Property tests

# The Hegel property tests, deep: hegel.toml's nightly profile runs 10,000
# randomized cases per property. Pushes and pull requests run 1,000 cases
# with CI's derandomized profile, so they see the same inputs every time;
# this run is where new inputs come from.
on:
  schedule:
    # Daily at 06:17 UTC, off the hour, when scheduled runs pile up.
    - cron: "17 6 * * *"
  workflow_dispatch:

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Selects hegel.toml's nightly profile over CI's.
  HEGEL_DEFAULT_PROFILE: nightly
  # swiftly (swift.org's toolchain installer), pinned and checked as in
  # ci.yml.
  SWIFTLY_VERSION: "1.2.0"
  SWIFTLY_SHA256: a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987

jobs:
  macos:
    name: Property tests macOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SWIFT_VERSION: "6.4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        run: |
          set -o pipefail
          HEGEL_STATISTICS=1 swift test --filter FPPipePropertyTests 2>&1 \
            | tee "$RUNNER_TEMP/property-tests.log"

      # A failure's report ends with the trait that replays it, so the
      # failing case can be run locally.
      - name: Show failures
        if: failure()
        run: |
          grep -E -A40 "recorded an issue" "$RUNNER_TEMP/property-tests.log" | cut -c1-400 || true

  linux:
    name: Property tests Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swift:6.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        run: |
          set -o pipefail
          HEGEL_STATISTICS=1 swift test --filter FPPipePropertyTests 2>&1 \
            | tee "$RUNNER_TEMP/property-tests.log"

      - name: Show failures
        if: failure()
        shell: bash
        run: |
          grep -E -A40 "recorded an issue" "$RUNNER_TEMP/property-tests.log" | cut -c1-400 || true
